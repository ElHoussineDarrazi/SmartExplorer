[package]
name = "smart_explorer"
version = "0.3.1"
edition = "2024"
rust-version = "1.85"
description = "Cross-platform file manager (Windows, Linux, macOS) in Rust"
license = "MIT"
repository = "https://github.com/ElHoussineDarrazi/SmartExplorer"
homepage = "https://github.com/ElHoussineDarrazi/SmartExplorer"
readme = "README.md"
keywords = ["file-manager", "explorer", "gui", "egui", "cross-platform"]
categories = ["gui", "filesystem", "command-line-utilities"]

[dependencies]
# GUI (100% Rust, cross-platform, no system dependency).
eframe = "0.36"
egui = "0.36"

# System trash (Windows Recycle Bin, macOS/Linux Trash).
trash = "5"

# Open a file/folder with the OS default application.
open = "5"

# Standard directories (home, desktop, downloads…).
dirs = "7"

# Modification date formatting.
chrono = "0.4"

# Image thumbnail decoding/resizing (Icons view):
# common formats only, without heavy codecs (avif, rayon…).
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
    "gif",
    "tiff",
    "bmp",
    "ico",
] }

# --- Remote connections (SSH/SFTP and FTP) ---
# ssh2-rs: Rust bindings to libssh2 (SSH + SFTP, password auth).
# Requires libssh2 installed on the system (brew install libssh2, apt install libssh2-1-dev).
ssh2 = "0.9"

# ftp: pure-Rust, synchronous FTP client.
ftp = "3"

# System information (OS, CPU, GPU, RAM, storage) for the Computer Properties window.
sysinfo = { version = "0.33", features = ["system", "disk"] }

# --- Encrypted credential storage ---
# Symmetric encryption (XChaCha20-Poly1305) of passwords.
chacha20poly1305 = "0.11"
# Key derivation from the master password (Argon2id).
argon2 = "0.5"
# Salt / nonce generation.
rand = "0.8"
# Serialization of the remote server list.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Typed error enums.
thiserror = "1"

# --- macOS: real system icons (NSWorkspace.iconForFile) ---
# WARNING: this section must stay AFTER all cross-platform dependencies —
# in TOML, a section extends to the next header, so any dependency placed
# here would become macOS-exclusive.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
# PDF previews (Icons view): first page rendered natively by PDFKit.
objc2-pdf-kit = "0.3"

# --- Windows: ssh2 built from source (no system libssh2 required) ---
[target.'cfg(target_os = "windows")'.dependencies.ssh2]
version = "0.9"
default-features = false
features = ["vendored-openssl"]

# Release profile optimizations.
[profile.release]
opt-level = 2
lto = true
codegen-units = 1
