name: ✨ Feature request
description: Suggest a new idea or an improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your idea! Describe the feature and the need it would address.

  - type: textarea
    id: problem
    attributes:
      label: Problem / need
      description: What problem does this feature solve? What current frustration?
      placeholder: I would like to be able to… because currently…
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe how you would like it to work.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Have you considered other solutions or workarounds?
      placeholder: Optional

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, references to other applications, or any useful detail.
      placeholder: Optional
