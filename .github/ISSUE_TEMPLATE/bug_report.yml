name: 🐞 Bug report
description: Report unexpected behavior or a crash
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Fill in the form below to help us reproduce it.
        **For a security flaw**, do NOT open a public issue: instead follow [SECURITY.md](https://github.com/ElHoussineDarrazi/SmartExplorer/security/advisories/new).

  - type: input
    id: version
    attributes:
      label: Version
      description: SmartExplorer version (the "About" tab, or the Release tag).
      placeholder: "0.3.1"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows 10/11
        - Linux (Debian/Ubuntu)
        - Linux (other)
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the observed behavior, and the expected behavior.
      placeholder: |
        When I…, the application…
        I expected…
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact steps to reproduce the problem.
      placeholder: |
        1. Open the application
        2. Go to…
        3. Click on…
        4. The bug appears
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error messages / logs
      description: Paste any error message or relevant trace. Optional but very useful.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I have searched existing issues and this bug is not already reported.
          required: true
        - label: This bug is not a security flaw (otherwise, see SECURITY.md).
          required: true
