name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install libssh2 (required by ssh2 crate)
        run: brew install libssh2

      - name: Build release
        run: cargo build --release

      - name: Strip binary
        run: strip target/release/smart_explorer

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-explorer-macos
          path: target/release/smart_explorer

  build-linux:
    name: Build Linux (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssh2-1-dev pkg-config libssl-dev

      - name: Build release
        run: cargo build --release

      - name: Strip binary
        run: strip target/release/smart_explorer

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-explorer-linux
          path: target/release/smart_explorer

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-explorer-windows
          path: target/release/smart_explorer.exe

  release:
    name: Create GitHub Release
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/**/*
          draft: false
          prerelease: false