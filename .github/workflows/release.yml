name: Build and Release

# Déclenché par un tag vX.Y.Z (release) ou manuellement (workflow_dispatch).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Nécessaire pour créer la Release GitHub.
permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------
  # macOS : app bundle signée + DMG
  # ------------------------------------------------------------------
  build-macos:
    name: Build macOS (DMG)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install libssh2 (required by ssh2 crate)
        run: brew install libssh2

      - name: Ensure packaging script is executable
        run: chmod +x scripts/package_macos.sh

      - name: Build release and package macOS (app bundle + DMG)
        run: ./scripts/package_macos.sh

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-explorer-macos
          path: dist/SmartExplorer-macos.dmg

  # ------------------------------------------------------------------
  # Linux : paquet .deb (Ubuntu/Debian)
  # ------------------------------------------------------------------
  build-linux:
    name: Build Linux (.deb)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssh2-1-dev pkg-config libssl-dev \
            dpkg-dev imagemagick desktop-file-utils

      - name: Build release
        shell: bash
        run: |
          set -o pipefail
          cargo build --release 2>&1 | tee /tmp/build.log || {
            # Expose l'erreur dans les annotations publiques du run.
            tail -n 8 /tmp/build.log | sed 's/^/  /' > /tmp/err.txt
            echo "### ❌ cargo build --release a échoué" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"; cat /tmp/build.log | tail -n 60 >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r line; do
              echo "::error title=cargo build (Linux)::${line:0:240}"
            done < /tmp/err.txt
            exit 1
          }

      - name: Strip binary
        run: strip target/release/smart_explorer

      - name: Package Linux (.deb)
        run: |
          chmod +x installer/linux/package_deb.sh
          ./installer/linux/package_deb.sh

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-explorer-linux
          path: dist/*.deb

  # ------------------------------------------------------------------
  # Windows : installateur NSIS (.exe)
  # ------------------------------------------------------------------
  build-windows:
    name: Build Windows (setup.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Prioriser Strawberry Perl (nécessaire à OpenSSL vendored)
        shell: pwsh
        run: |
          # Le perl de Git Bash (sans modules Win32) peut masquer Strawberry
          # Perl et faire échouer `perl ./Configure` d'openssl-src.
          foreach ($p in @("C:\Strawberry\c\bin", "C:\Strawberry\perl\bin", "C:\Strawberry\perl\site\bin")) {
            if (Test-Path $p) { echo $p | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append }
          }
          perl -v | Select-Object -First 2

      - name: Build release
        shell: bash
        env:
          # openssl-src (ssh2 vendored) doit utiliser Strawberry Perl — le perl
          # de Git Bash manque des modules requis (Locale::Maketext::Simple…) et
          # fait échouer `perl ./Configure` (exit 2).
          OPENSSL_SRC_PERL: C:/Strawberry/perl/bin/perl.exe
        run: |
          set -o pipefail
          cargo build --release 2>&1 | tee /tmp/build.log || {
            echo "### ❌ cargo build --release a échoué" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"; tail -n 60 /tmp/build.log >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 8 /tmp/build.log | while IFS= read -r line; do
              echo "::error title=cargo build (Windows)::${line:0:240}"
            done
            exit 1
          }

      - name: Prepare dist folders
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path dist_tmp, dist | Out-Null

      - name: Generate .ico from AppIcon.png
        shell: pwsh
        run: magick assets/icons/AppIcon.png -background none -alpha remove -resize 256x256 dist_tmp\app.ico

      # NSIS est répertorié sur l'image windows mais absent du PATH et des
      # chemins standards : on l'installe explicitement via Chocolatey.
      - name: Installer NSIS (makensis)
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Package Windows (NSIS setup.exe)
        shell: pwsh
        run: |
          # Version depuis le tag (vX.Y.Z -> X.Y.Z) ou Cargo.toml
          $tag = "${{ github.ref_name }}"
          if ($tag -match '^v') { $version = $tag.TrimStart('v') }
          else { $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches.Groups[1].Value }
          Write-Host "Version: $version"

          # makensis (NSIS préinstallé) n'est pas toujours dans le PATH.
          $candidates = @(
            "C:\Program Files (x86)\NSIS\makensis.exe",
            "C:\Program Files\NSIS\makensis.exe"
          )
          $makensis = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $makensis) {
            $cmd = Get-Command makensis -ErrorAction SilentlyContinue
            if ($cmd) { $makensis = $cmd.Source }
            else { throw "makensis introuvable (NSIS non installé sur le runner ?)" }
          }
          Write-Host "makensis: $makensis"

          & $makensis `
            "/DVERSION=$version" `
            "/DSOURCE_DIR=$PWD\target\release" `
            "/DOUT_DIR=$PWD\dist_tmp" `
            installer\windows\smartexplorer.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis a échoué (code $LASTEXITCODE)" }
          Move-Item -Force dist_tmp\SmartExplorer-windows-setup.exe dist\

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-explorer-windows
          path: dist/SmartExplorer-windows-setup.exe

  # ------------------------------------------------------------------
  # Publication : crée (ou met à jour) la Release GitHub du tag
  # avec les 3 installateurs.
  # ------------------------------------------------------------------
  release:
    name: Create GitHub Release
    needs: [build-macos, build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List release files
        run: ls -lh dist/

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SmartExplorer ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            dist/SmartExplorer-macos.dmg
            dist/smartexplorer_*.deb
            dist/SmartExplorer-windows-setup.exe